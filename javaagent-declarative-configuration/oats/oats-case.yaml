name: javaagent declarative config excludes actuator health traces
fixture:
  compose:
    template: lgtm
    file: ./docker-compose.yml
seed:
  type: app
input:
  # retry: the compose fixture reports "running" before Spring finishes booting,
  # so the first request(s) can hit a closed port; retry until the app is ready.
  - path: /api/example
    retry: {}
  - path: /actuator/health
    retry: {}
  - path: /api/remote
    retry: {}
expected:
  traces:
    - traceql: '{ span.http.route = "/api/example" }'
      match_spans:
        - name: GET /api/example
          attributes:
            - key: http.request.method
              value: GET
            - key: http.route
              value: /api/example
    - traceql: '{ span.http.route = "/actuator/health" }'
      absent: true
    - traceql: '{ span.peer.service = "example-backend" }'
      count: '>= 1'
