[tools]
"aqua:grafana/gcx" = "v0.5.0"
"aqua:grafana/oats" = "0.8.0"
k3d = "5.8.3"
kubectl = "1.36.3"

# Linters
"aqua:grafana/flint" = "0.22.10"
dotenv-linter = "4.0.0"
lychee = "0.24.2"
rumdl = "0.2.43"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"
