[tools]
"aqua:grafana/oats" = "0.7.0"
k3d = "5.8.3"
kubectl = "1.36.2"

# Linters
"aqua:dotenv-linter/dotenv-linter" = "4.0.0"
"cargo:https://github.com/grafana/flint" = "rev:1cd44f7"
lychee = "0.24.2"
rumdl = "0.2.38"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"
