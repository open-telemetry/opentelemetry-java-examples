[tools]
"aqua:grafana/gcx" = "v1.7.1"
"aqua:grafana/oats" = "0.10.0"
k3d = "5.9.0"
kubectl = "1.37.1"

# Linters
"aqua:grafana/flint" = "0.22.15"
dotenv-linter = "4.0.0"
lychee = "0.24.2"
rumdl = "0.3.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"
