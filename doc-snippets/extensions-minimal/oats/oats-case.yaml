name: extensions minimal traces custom processor attribute
fixture:
  compose:
    template: lgtm
    file: ./docker-compose.yml
interval: 5s
seed:
  type: app
input:
  # retry: the compose fixture reports "running" before Spring finishes booting,
  # so the first request(s) can hit a closed port; retry until the app is ready.
  - path: /hello
    retry: {}
expected:
  traces:
    - traceql: '{ span.http.route = "/hello" }'
      match_spans:
        - name: GET /hello
          attributes:
            - key: http.request.method
              value: GET
            - key: http.route
              value: /hello
            - key: custom.processor
              value: active
